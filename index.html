
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-4">Write a Message</h2>
        <p class="text-gray-500 text-sm mb-2">200 characters max</p>
        
        <textarea id="message" rows="5" maxlength="200" placeholder="Type your message here..."
            class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </textarea>

        <p id="counter" class="text-sm text-gray-600 mt-2">
            0/200 characters | 200 remaining
        </p>

        <p id="warning" class="text-red-500 text-sm mt-2"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
